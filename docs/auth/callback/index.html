<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Возврат в приложение</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f7;
            color: #1f1f1f;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }

        main {
            max-width: 360px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 22px;
        }

        p {
            margin: 0 0 24px;
            line-height: 1.5;
            color: #555;
        }

        a {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            background: #21a038;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

        a[hidden] {
            display: none;
        }
    </style>
</head>
<body>
    <main>
        <h1 id="title">Возврат в приложение</h1>
        <p id="message">Сюда СберБизнес ID возвращает после входа. Чтобы войти, нажмите «Войти через СберБизнес ID» в приложении.</p>
        <a id="open-app" hidden>Открыть приложение</a>
    </main>

    <script>
        (function () {
            "use strict";

            // Должен совпадать с SberAuthConfig.CallbackUri в приложении.
            var appCallback = "sbersystem://auth/callback";

            // В приложение уходят только эти параметры, всё остальное из адреса отбрасывается.
            var forwarded = ["code", "state", "error", "error_description"];

            var query = new URLSearchParams(window.location.search);
            var passed = new URLSearchParams();

            forwarded.forEach(function (name) {
                if (query.has(name)) {
                    passed.set(name, query.get(name));
                }
            });

            // Страницу открыли без параметров Сбера — остаётся только подсказка.
            if (!passed.toString()) {
                return;
            }

            var openApp = document.getElementById("open-app");
            openApp.href = appCallback + "?" + passed.toString();
            openApp.hidden = false;

            if (query.has("error")) {
                document.getElementById("title").textContent = "Вход не выполнен";
                document.getElementById("message").textContent = "СберБизнес ID не завершил вход. Вернитесь в приложение, чтобы увидеть причину.";
            } else {
                document.getElementById("message").textContent = "Вход выполнен. Сейчас откроется приложение.";
            }

            // Браузер может не открыть приложение без действия пользователя, поэтому выше есть кнопка.
            window.location.href = openApp.href;
        })();
    </script>
</body>
</html>
